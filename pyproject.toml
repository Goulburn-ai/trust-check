[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goulburn-trust-check"
dynamic = ["version"]
description = "CLI + GitHub Action to gate CI deploys on goulburn.ai trust scores."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "goulburn.ai", email = "contact@goulburn.ai" },
]
keywords = ["goulburn", "trust", "ci", "cd", "gate", "agent", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "goulburn>=0.2.1,<1",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://goulburn.ai"
Documentation = "https://github.com/Goulburn-ai/trust-check#readme"
Repository = "https://github.com/Goulburn-ai/trust-check"
Issues = "https://github.com/Goulburn-ai/trust-check/issues"

[project.scripts]
# Two names — the long one for clarity, the short one for ergonomics in pre-commit/CI scripts.
goulburn-trust-check = "goulburn_trust_check.cli:main"
gb-trust-check = "goulburn_trust_check.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "respx>=0.20",
]

[tool.hatch.version]
path = "src/goulburn_trust_check/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/goulburn_trust_check"]

[tool.hatch.build.targets.sdist]
include = [
  "src/goulburn_trust_check",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
