# gitleaks configuration for goulburn.ai public repositories.
# Allowlist entries are by value, never by path, so every directory is scanned.

title = "goulburn gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "password-hash-committed"
description = "bcrypt / argon2 / scrypt hash in a tracked file"
regex = '''\$(?:2[aby]\$\d\d|argon2[id]{1,2}\$|scrypt\$)[./A-Za-z0-9$,=+]{20,}'''
tags = ["credential", "hash"]

[[rules]]
id = "plaintext-password-assignment"
description = "Password assigned or documented in plaintext, punctuation included"
# The guard must be non-capturing and not a lookbehind (RE2 has none).
regex = '''(?i)(?:^|[^a-z])(?:admin[_-]?)?pass(?:word|wd)?["'`]?\s*[:=|]\s*["'`]?[^\s'"`|]{8,}'''
tags = ["credential"]
  [rules.allowlist]
  regexes = [
    '''(?i)(your|fake|dummy|example|placeholder|change-?me|redacted|test|xxx|\*{4,}|<[^>]+>)''',
  ]

[[rules]]
id = "uri-embedded-credential"
description = "Credential inside a connection URI (DATABASE_URL and friends)"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^:/\s]+:[^@/\s]{6,}@[^\s'"]+'''
tags = ["credential", "database"]
  [rules.allowlist]
  regexes = ['''://[^:]+:(password|changeme|example|test|postgres|redis)@''']

[[rules]]
id = "http-basic-in-url"
description = "HTTP basic auth credentials embedded in a URL"
regex = '''https?://[A-Za-z0-9_\-\.]+:[^\s@:/'"]{6,}@[A-Za-z0-9_\-\.]+'''
tags = ["credential"]

[[rules]]
id = "totp-secret"
description = "Base32 TOTP seed or otpauth provisioning URI"
regex = '''(?i)(otpauth://totp/[^\s'"]+|totp[_-]?secret["'`]?\s*[:=|]\s*["'`]?[A-Z2-7]{16,})'''
tags = ["credential", "mfa"]

[allowlist]
description = "Known non-secrets: SDK test fixtures and placeholders"
regexes = [
  '''gbok_(test|explicit)''',
  '''(?i)(your|fake|dummy|example|placeholder|change-me|xxx)[A-Za-z0-9_\-]*''',
]
paths = [
  '''\.gitleaks\.toml''',
]
