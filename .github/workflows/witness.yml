name: witness

# External witness for the goulburn.ai attestation ledger.
#
# Every day this workflow fetches the fleet Merkle root from the public
# verify API and commits it to this repository. The commit history is the
# witness: goulburn cannot rewrite its attestation chains without the
# recomputed root diverging from what is recorded here, on infrastructure
# outside its database. Anyone can replay the check:
#
#   1. GET https://api.goulburn.ai/api/v1/verify/roots?date=YYYY-MM-DD
#   2. Compare "root" with witness/roots/YYYY-MM-DD.json in this repo
#   3. GET /verify/agents/{name} for an inclusion proof of any agent
#   4. Fold the leaf up audit_path (sha256 over hex concatenation,
#      duplicate-last on odd levels) and compare with the root
#
# Scheme: sha256-hexcat-dup-last-v1, leaves ordered by agent_id text asc.
# Signing key recipe: GET /verify/key.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the day's root
  issues: write     # open an alert issue when a run fails

concurrency:
  group: witness
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch, validate and record the day's root
        run: |
          set -euo pipefail
          BODY=$(curl -sSf --retry 3 --retry-delay 20 --max-time 30 \
            -A "goulburn-witness (+https://github.com/Goulburn-ai/trust-check)" \
            "https://api.goulburn.ai/api/v1/verify/roots")
          # Validate every field before any of it touches a path or a commit.
          # DAY becomes a file name; an unvalidated value such as "../x" would
          # write outside witness/roots with push rights.
          DAY=$(printf '%s' "$BODY" | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)
          day, root = d.get("day", ""), d.get("root", "")
          if not re.fullmatch(r"20[0-9]{2}-[01][0-9]-[0-3][0-9]", day):
              sys.exit(f"bad day: {day!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", root):
              sys.exit(f"bad root: {root!r}")
          if not isinstance(d.get("leaf_count"), int) or d["leaf_count"] < 0:
              sys.exit("bad leaf_count")
          print(day)
          ')
          FILE="witness/roots/${DAY}.json"
          mkdir -p witness/roots
          if [ -f "$FILE" ]; then
            # Same day already witnessed: the root must not have changed.
            if ! printf '%s' "$BODY" | python3 -c '
          import json, sys
          new = json.load(sys.stdin); old = json.load(open(sys.argv[1]))
          sys.exit(0 if new["root"] == old["root"] else 1)' "$FILE"; then
              echo "::error::root for ${DAY} differs from the witnessed copy"; exit 1
            fi
            echo "root for ${DAY} already witnessed and unchanged"; exit 0
          fi
          printf '%s' "$BODY" | python3 -m json.tool > "$FILE"
          git config user.name "goulburn-witness"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE"
          git commit -m "witness: fleet merkle root for ${DAY}"
          git push

      - name: alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "witness run failed $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A missing day is a gap in the external record; re-run once the API is healthy."
