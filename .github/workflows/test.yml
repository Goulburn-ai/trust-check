name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          # Install from local source so we exercise the in-tree code, not PyPI.
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/

  action-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the Action's Docker image
        # The image installs only from requirements.lock (--require-hashes),
        # so a lock that drifts from pyproject or a re-uploaded package
        # fails here before it can reach a release tag.
        run: docker build -t goulburn-trust-check:test .
      - name: Smoke the built image (hostile name is refused with no network call)
        run: |
          set +e
          docker run --rm --network none -e INPUT_AGENT='../owner/me' -e INPUT_API_KEY=x goulburn-trust-check:test
          rc=$?
          test "$rc" = "1" || { echo "::error::expected exit 1, got $rc"; exit 1; }
