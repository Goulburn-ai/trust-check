name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          # Install from local source so we exercise the in-tree code, not PyPI.
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/

  action-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Action's Docker image
        # Docker build pip-installs goulburn-trust-check==1.1.0 from PyPI;
        # this also serves as an end-to-end install smoke test.
        run: docker build -t goulburn-trust-check:test .
