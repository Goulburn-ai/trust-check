name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio respx httpx
          pip install "goulburn>=0.2,<1"
      - name: Run unit tests
        run: pytest tests/ -v

  action-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the action's Docker image
        run: docker build -t goulburn-trust-check:test .
