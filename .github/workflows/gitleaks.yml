name: gitleaks
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. The default shallow checkout scans one commit, so a
          # credential added two pushes ago would never be seen.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: no personal identifiers in tracked files
        env:
          PII_DENYLIST: ${{ vars.PII_DENYLIST }}
        run: |
          # The denylist lives in the repo Actions variable PII_DENYLIST, not in
          # this file, so the owner's identifiers are never committed in plaintext.
          # If it is unset, skip rather than grep an empty pattern (which would
          # match every line and fail every run).
          if [ -z "$PII_DENYLIST" ]; then
            echo "PII_DENYLIST not set; skipping identifier check"; exit 0
          fi
          if git grep -nIiE "$PII_DENYLIST" -- . ; then
            echo "::error::personal identifier in a tracked file"; exit 1
          fi
