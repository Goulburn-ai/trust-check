name: release-pypi

# Trigger: any tag starting with v (v1.1.0, v1.2.0, v2.0.0, ...).
# Publishes goulburn-trust-check to PyPI and creates a GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed by softprops/action-gh-release to create the Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release   # optional: gate behind a protected environment if desired
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify package version matches the tag
        run: |
          set -euxo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re,sys; src=open('src/goulburn_trust_check/__init__.py').read(); m=re.search(r'__version__\\s*=\\s*[\\\"\\\']([^\\\"\\\']+)', src); print(m.group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
